services:
  tigergraph:
    # tigergraph/tigergraph is the licensed Enterprise image (needs a license key we don't have).
    # tigergraph/community is the free Community Edition — no license required, ready immediately.
    # Loaded locally via `docker load` from the dl.tigergraph.com CE download (no public :latest tag).
    image: tigergraph/community:4.3.0-rc1
    container_name: hhgoa-tigergraph
    init: true
    ulimits:
      nofile:
        soft: 1000000
        hard: 1000000
    ports:
      - "14022:22"     # ssh (default password: tigergraph)
      - "9000:9000"    # REST++ API
      - "14240:14240"  # GraphStudio UI / GSQL
    volumes:
      - tigergraph_data:/home/tigergraph
    restart: unless-stopped

  mcp-server:
    # The official TigerGraph MCP server (tigergraph-mcp), containerized — see
    # graph/mcp-server/Dockerfile and CLAUDE.md's Stack section. Replaces manually
    # running `pnpm --filter @hhgoa/graph mcp:start` (still available as a native
    # fallback; see graph/mcp-server/.env.example).
    build: ./graph/mcp-server
    container_name: hhgoa-mcp-server
    depends_on:
      - tigergraph
    ports:
      - "8000:8000"
    environment:
      # Same Community Edition local-dev defaults as graph/mcp-server/.env.example,
      # but TG_HOST points at the `tigergraph` service by its compose network name
      # instead of localhost, since this runs inside the compose network.
      TG_HOST: http://tigergraph
      TG_GRAPHNAME: hhgoa_fraud
      TG_USERNAME: tigergraph
      TG_PASSWORD: tigergraph
      TG_RESTPP_PORT: "9000"
      TG_GS_PORT: "14240"
    restart: unless-stopped

volumes:
  tigergraph_data:
